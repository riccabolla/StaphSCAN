name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system bioinformatics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mash ncbi-blast+ minimap2 samtools

      - name: Verify external CLI tools
        run: |
          mash --version
          blastn -version | head -n 1
          minimap2 --version
          samtools --version | head -n 1

      - name: Install dependencies and StaphSCAN
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install --no-build-isolation --no-deps .

      - name: Run pipeline tests
        run: |
          pytest test/ -v